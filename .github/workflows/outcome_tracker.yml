name: Outcome tracker (daily)

on:
  schedule:
    - cron: "30 21 * * 1-5"  # Mon-Fri at 21:30 UTC (~16:30 ET, after market close)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-state
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update outcomes
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python outcome_tracker.py
